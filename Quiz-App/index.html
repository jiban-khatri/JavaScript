<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>Try Your Knowledge - JavaScript Short Quiz</h2>
        <div class="user">
            <i class="ri-user-fill"></i>
            <span id="user-name"></span>
        </div>
    </header>



    <div class="container">
        <div class="outer">
            <!-- Get Player Name First -->
            <div class="initial-phase">
                <form id="my-form">
                    <h3 style="font-size: 30px; color: rgb(144, 0, 255);">You will get 90 sec to finish the quiz.</h3>
                    <input type="text" id="player-input-name" placeholder="Enter your name" required>
                    <button id="start-game" type="submit">Start</button>
                </form>
            </div>


            <!-- Game InterFace -->
            <div class="game-box">
                <!-- timer section -->
                <div class="timer-section">
                    <i class="ri-timer-fill"></i>
                    <span id="timer-sec"></span>
                </div>

                
            </div>

        </div>
    </div>


    


    <script src="./script.js"></script>
</body>

</html>
