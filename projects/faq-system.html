<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        .faq-item {
            border: 1px solid #ddd;
            margin: 10px 0;
            padding: 10px;
        }

        .question {
            font-weight: bold;
            cursor: pointer;
        }

        .answer {
            display: none;
            margin-top: 5px;
        }

        .answer.show {
            display: block;
        }
    </style>

</head>

<body>


    <div class="faq">
        
    </div>




    <script src="./faq-system.js"></script>
</body>

</html>
